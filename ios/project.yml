# Generate HUD.xcodeproj with `xcodegen` (brew install xcodegen).
name: HUD
options:
  deploymentTarget:
    iOS: "27.0"
  indentWidth: 4
  tabWidth: 4
  usesTabs: true
targets:
  HUD:
    type: application
    platform: iOS
    sources: [HUD]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augeocorp.hud
        INFOPLIST_FILE: HUD/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        # CI overrides this with the workflow run number on each upload.
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
